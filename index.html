<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Buzón CUC Escucha</h1>
        <p>Tu voz ayuda a mejorar nuestra universidad</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Comparte tu sugerencia</h2>

            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="correo">Correo institucional</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@cuc.edu.co">

                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria">
                    <option value="">Selecciona una categoría</option>
                    <option value="bienestar">Bienestar</option>
                    <option value="servicios">Servicios</option>
                    <option value="clases">Clases</option>
                    <option value="inclusion">Inclusión</option>
                    <option value="espacios">Espacios</option>
                    <option value="procesos">Procesos académicos</option>
                </select>

                <label for="sugerencia">Tu sugerencia</label>
                <textarea id="sugerencia" name="sugerencia" rows="6"
                    placeholder="Escribe aquí tu idea o sugerencia..."></textarea>

                <button type="submit">Enviar sugerencia</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Universidad de la Costa - Buzón CUC Escucha</p>
    </footer>

</body>
</html>
